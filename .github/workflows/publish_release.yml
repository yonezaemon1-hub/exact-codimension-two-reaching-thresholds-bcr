name: Publish No.22 GitHub Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Yonezu_2026_Exact_Codim2_BCR.pdf'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s Yonezu_2026_Exact_Codim2_BCR.pdf
          python verify_n8.py --n 8 --json verification_n8.regenerated.json
          cmp verification_n8.json verification_n8.regenerated.json
          grep 'Yonezu_2026_Exact_Codim2_BCR.pdf' SHA256SUMS.txt | sha256sum -c -
          echo PASS_RELEASE_PREFLIGHT=true
      - name: Create v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo RELEASE_ALREADY_EXISTS=true
            exit 0
          fi
          cat > release_notes.md <<'EOF'
          No.22 public release.

          Exact Codimension-Two Reaching Thresholds for Binary Completely Reachable Automata

          Includes the frozen preprint and exhaustive n=8 certificate.

          Finite certificate:
          - normalized defect-one maps: 141120
          - completely reachable: 136704
          - exact maximum: 17
          - extremal automata: 68

          This is a preprint / reproducibility release and is not peer reviewed.
          EOF
          gh release create v1.0.0             --target "${GITHUB_SHA}"             --title "v1.0.0 — Exact Codimension-Two Reaching Thresholds"             --notes-file release_notes.md             Yonezu_2026_Exact_Codim2_BCR.pdf             verification_n8.json             verify_n8.py             SHA256SUMS.txt             CITATION.cff
